name: Actualizar calendario y publicar piloto

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: LoL_Predictor_Cloud_MVP_v070/LoL_Predictor_Cloud_MVP_v070
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Generar pagina usando calendario real
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: python cloud.py --live --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: LoL_Predictor_Cloud_MVP_v070/LoL_Predictor_Cloud_MVP_v070/site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
